<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" class="suit-svg" role="img" aria-label="Tri-Suit Vorderseite mit Logo-Positionen">
  <defs>
    <linearGradient id="fabricGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4b63"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <path id="suitHalfFront" d="
      M150 36
      C158 36 166 40 172 46
      L190 54
      C204 62 212 74 216 90
      L210 120
      C208 127 199 128 195 123
      L188 100
      C184 106 179 111 177 117
      C171 146 168 172 167 194
      C166 214 168 228 171 242
      C173 264 175 292 174 314
      C174 322 173 328 170 331
      L158 324
      C154 310 152 292 151 274
      C150.7 268 150.3 267 150 266"/>
  </defs>

  <!-- Anzug-Silhouette (beide Hälften) -->
  <use href="#suitHalfFront" fill="url(#fabricGrad)" stroke="#0f172a" stroke-width="2.5"/>
  <use href="#suitHalfFront" fill="url(#fabricGrad)" stroke="#0f172a" stroke-width="2.5" transform="translate(300,0) scale(-1,1)"/>

  <!-- Kragen vorne (Ausschnitt) -->
  <path d="M136 42 C140 52 160 52 164 42 C158 38 142 38 136 42 Z" fill="#0f172a"/>

  <!-- Reißverschluss -->
  <rect x="148.7" y="50" width="2.6" height="112" rx="1.3" fill="#f97316"/>
  <circle cx="150" cy="164" r="3.2" fill="#f97316"/>

  <!-- Ärmel-Abschlüsse -->
  <path d="M195 123 L196 116 L207 118" fill="none" stroke="#0f172a" stroke-width="2" opacity="0.8"/>
  <path d="M105 123 L104 116 L93 118" fill="none" stroke="#0f172a" stroke-width="2" opacity="0.8"/>

  <!-- Bein-Abschlüsse (Silikonbund) -->
  <path d="M170 331 L158 324" stroke="#f97316" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M130 331 L142 324" stroke="#f97316" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Schritt-Kontur -->
  <path d="M144 258 L150 266 L156 258" fill="none" stroke="#0f172a" stroke-width="2" opacity="0.7"/>

  <!-- Seitliche Akzentstreifen -->
  <path d="M177 117 C171 146 168 172 167 194 C166 214 168 228 171 242" stroke="#f97316" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M123 117 C129 146 132 172 133 194 C134 214 132 228 129 242" stroke="#f97316" stroke-width="2.5" fill="none" opacity="0.6"/>

  <!-- Logo-Zonen -->
  <g class="zone-marker" data-zone="brust"><title>Brust – € 300</title>
    <rect x="116" y="80" width="68" height="34"/>
    <circle cx="184" cy="80" r="9" class="badge"/><text x="184" y="84" class="badge-num">1</text>
  </g>
  <g class="zone-marker" data-zone="schulter-l"><title>Schulter links – € 100</title>
    <rect x="110" y="44" width="16" height="14"/>
    <circle cx="117" cy="38" r="9" class="badge"/><text x="117" y="42" class="badge-num">2</text>
  </g>
  <g class="zone-marker" data-zone="schulter-r"><title>Schulter rechts – € 100</title>
    <rect x="174" y="44" width="16" height="14"/>
    <circle cx="183" cy="38" r="9" class="badge"/><text x="183" y="42" class="badge-num">3</text>
  </g>
  <g class="zone-marker" data-zone="aermel-l"><title>Ärmel links – € 150</title>
