    <circle cx="86" cy="120" r="9" class="badge"/><text x="86" y="124" class="badge-num">4</text>
  </g>
  <g class="zone-marker" data-zone="aermel-r"><title>Ärmel rechts – € 150</title>
    <rect x="197" y="92" width="14" height="24"/>
    <circle cx="214" cy="120" r="9" class="badge"/><text x="214" y="124" class="badge-num">5</text>
  </g>
  <g class="zone-marker" data-zone="huefte-l"><title>Hüfte links – € 120</title>
    <rect x="132" y="214" width="14" height="26"/>
    <circle cx="128" cy="210" r="9" class="badge"/><text x="128" y="214" class="badge-num">6</text>
  </g>
  <g class="zone-marker" data-zone="huefte-r"><title>Hüfte rechts – € 120</title>
    <rect x="154" y="214" width="14" height="26"/>
    <circle cx="172" cy="210" r="9" class="badge"/><text x="172" y="214" class="badge-num">7</text>
  </g>
  <g class="zone-marker" data-zone="schenkel-l"><title>Oberschenkel links – € 200</title>
