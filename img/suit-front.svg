    <circle cx="124" cy="264" r="9" class="badge"/><text x="124" y="268" class="badge-num">8</text>
  </g>
  <g class="zone-marker" data-zone="schenkel-r"><title>Oberschenkel rechts – € 200</title>
    <rect x="156" y="268" width="16" height="40"/>
    <circle cx="176" cy="264" r="9" class="badge"/><text x="176" y="268" class="badge-num">9</text>
  </g>
</svg>
