       C118 32 136 26 150 26
       C164 26 182 32 182 38
       L182 52
       L196 58
       C204 62 208 70 206 80
       L200 106
       C198 114 190 116 184 112
       L182 108
       L182 118
       C182 130 180 140 176 146
       L176 168
       C190 172 198 182 198 196
       L198 260
       C198 276 190 288 176 292
       L160 296
       C154 296 151 293 150 288
       L150 240
       L150 240
       L150 288
       C149 293 146 296 140 296
       L124 292
       C110 288 102 276 102 260
       L102 196
       C102 182 110 172 124 168
       L124 146
       C120 140 118 130 118 118
       L118 108
       L116 112
       C110 116 102 114 100 106
       L94 80
       C92 70 96 62 104 58
       L118 52 Z"/>

  <!-- Kragen-Ausschnitt -->
  <path d="M132 30 C138 27 162 27 168 30 C164 40 136 40 132 30 Z" fill="#0f172a"/>

  <!-- Reißverschluss -->
  <rect x="148.6" y="40" width="2.8" height="104" rx="1.4" fill="#f97316"/>
  <circle cx="150" cy="146" r="3" fill="#f97316"/>

  <!-- Shorts-Abgrenzung -->
  <path d="M124 168 C134 172 166 172 176 168" stroke="#0f172a" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Logo-Zonen -->
  <g class="zone-marker" data-zone="brust"><title>Brust – € 300</title>
    <rect x="122" y="82" width="56" height="30"/>
    <circle cx="178" cy="80" r="9" class="badge"/><text x="178" y="84" class="badge-num">1</text>
  </g>
  <g class="zone-marker" data-zone="schulter-l"><title>Schulter links – € 100</title>
    <rect x="104" y="56" width="22" height="16"/>
    <circle cx="124" cy="54" r="9" class="badge"/><text x="124" y="58" class="badge-num">2</text>
  </g>
  <g class="zone-marker" data-zone="schulter-r"><title>Schulter rechts – € 100</title>
